<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max</title>
<style>
  body{margin:0;background:#000;overflow:hidden;color:#ff8a1f;font-family:sans-serif;text-align:center}
  canvas{display:block;margin:0 auto}
  h1{position:absolute;bottom:40px;width:100%;letter-spacing:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1>MAX</h1>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const pts=[];
for(let i=0;i<600;i++){
  const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);
  pts.push([Math.sin(b)*Math.cos(a),Math.sin(b)*Math.sin(a),Math.cos(b)]);
}
let t=0;
function draw(){
  x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(0,0,c.width,c.height);
  t+=0.01;
  const r=Math.min(c.width,c.height)*0.3;
  pts.forEach(p=>{
    const X=p[0]*Math.cos(t)-p[2]*Math.sin(t);
    const Z=p[0]*Math.sin(t)+p[2]*Math.cos(t);
    x.fillStyle='rgba(255,140,30,'+(0.4+0.6*(Z+1)/2)+')';
    x.beginPath();
    x.arc(c.width/2+X*r,c.height/2.3+p[1]*r,2,0,6.283);
    x.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
